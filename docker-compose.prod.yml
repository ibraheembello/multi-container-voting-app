# ============================================================================
# Production orchestration for the EC2 host. PULLS prebuilt images from GHCR
# (built by CI) instead of building on the box, so the small instance never has
# to compile anything. The host nginx terminates TLS for
# voting.ibraheembello.com and proxies to the web container on 127.0.0.1:8080.
#
#   IMAGE_TAG is pinned to the commit SHA by the deploy pipeline (default latest).
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: cv-db
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [cv-net]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: cv-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '64mb', '--maxmemory-policy', 'allkeys-lru']
    networks: [cv-net]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 12

  api:
    image: ghcr.io/ibraheembello/multi-container-voting-app-api:${IMAGE_TAG:-latest}
    container_name: cv-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [cv-net]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/api/health >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 50s

  worker:
    image: ghcr.io/ibraheembello/multi-container-voting-app-worker:${IMAGE_TAG:-latest}
    container_name: cv-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      WORKER_HEALTH_PORT: 4100
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [cv-net]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4100/health >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

  web:
    image: ghcr.io/ibraheembello/multi-container-voting-app-web:${IMAGE_TAG:-latest}
    container_name: cv-web
    restart: unless-stopped
    ports:
      - '127.0.0.1:8090:80'
    depends_on:
      api: { condition: service_healthy }
    networks: [cv-net]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1']
      interval: 20s
      timeout: 5s
      retries: 5

networks:
  cv-net:
    driver: bridge

volumes:
  db-data:
    driver: local
