# Host nginx config for the portfolio EC2. Terminates TLS for the subdomain and
# proxies to the web container (SPA + /api) on 127.0.0.1:8080. Certbot adds the
# 443 server block and the HTTP->HTTPS redirect on top of this.
server {
    listen 80;
    listen [::]:80;
    server_name voting.ibraheembello.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
