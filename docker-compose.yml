# ============================================================================
# Local full-stack orchestration (builds images from source).
# Brings up: postgres + redis + api (NestJS) + worker (TS) + web (nginx + SPA).
# One command:  docker compose up --build
# Open:         http://127.0.0.1:8080
# Every service declares a health check; dependents wait for service_healthy.
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: cv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [cv-net]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: cv-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    networks: [cv-net]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./api
    container_name: cv-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      API_PORT: 4000
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [cv-net]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/api/health >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  worker:
    build: ./worker
    container_name: cv-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      WORKER_HEALTH_PORT: 4100
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [cv-net]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4100/health >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    build:
      context: ./web
    container_name: cv-web
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      api: { condition: service_healthy }
    networks: [cv-net]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  cv-net:
    driver: bridge

volumes:
  db-data:
    driver: local
